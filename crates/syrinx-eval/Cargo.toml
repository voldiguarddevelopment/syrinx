[package]
name = "syrinx-eval"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# Real measured metrics (`real` module) — the primary build, ON BY DEFAULT: SIM-o
# (CAM++ cosine), RTF, and TTFB computed by running the real CosyVoice2/3
# `Synthesizer`.
default = ["real"]
real = ["dep:syrinx-serve", "syrinx-serve/real", "dep:syrinx-stt", "syrinx-stt/real", "dep:syrinx-cue", "dep:syrinx-qwen", "syrinx-qwen/real"]
# GPU passthrough. Without this the crate silently has no `cuda` feature at all, so
# `--features cuda` on a workspace build does not reach it and anything here that loads a
# model runs on CPU — the same omission that made `syrinx qwen --cuda` fall back silently
# (fixed 2026-09-06). A crate that gains a model dependency needs BOTH features extended.
cuda = ["real", "syrinx-serve/cuda", "syrinx-qwen/cuda", "syrinx-stt/cuda"]
# The affect judge (`affect` module): a speech-emotion model run through ONNX Runtime.
# OFF BY DEFAULT and it must stay that way — it pulls a 1.3 GB checkpoint and an ONNX
# Runtime download, neither of which a plain `cargo build` should ever touch. Implies
# `real` because the judge reuses `syrinx_qwen::speaker::resample` rather than growing a
# second resampler (see the module docs for why that matters).
affect = ["real", "dep:ort"]

[dependencies]
# The real synthesizer (+ its WAV resampler) the measured metrics drive. Optional,
# only pulled in by this crate's `real` feature.
syrinx-serve = { path = "../syrinx-serve", optional = true }
# The in-tree Whisper: the NATIVE WER oracle. C4.1 forbids Python at inference, and the
# CosyVoice-era helpers in `metrics` shell out to scripts/eval_wer.py — this does not.
syrinx-stt = { path = "../syrinx-stt", optional = true }
# BackendId / the capability rows the Qwen plan is built against.
syrinx-cue = { path = "../syrinx-cue", optional = true }
# The anchored speaker encoder, for SIM-o.
syrinx-qwen = { path = "../syrinx-qwen", optional = true }
# ONNX Runtime for the affect judge. Same version and feature set as the tree's other
# `ort` user (`syrinx-frontend`, the CosyVoice prompt speech-token tokenizer), so the two
# cannot end up wanting different runtimes; `download-binaries` means no system dep.
ort = { version = "2.0.0-rc.10", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }

[dev-dependencies]
# The SIM-o example reads/writes WAV and drives Candle directly.
hound = "3"
candle-core = "0.8"

# The affect-judge report. Behind `required-features` so a default `cargo build --examples`
# (which has `affect` off) does not try to compile against an absent module.
[[example]]
name = "affect_judge"
required-features = ["affect"]
