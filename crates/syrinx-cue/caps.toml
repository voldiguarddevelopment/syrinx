# Backend control capabilities (C2.1) — one entry per **checkpoint variant**, not per crate.
#
# Why per checkpoint: Qwen3-TTS 0.6B-CustomVoice and 1.7B-CustomVoice expose the identical
# API and differ only in whether the instruction is actually obeyed. A per-crate or
# per-variant table would be forced to lie about one of them.
#
# `*_support` values, and the distinction the whole file exists to carry:
#   unsupported — the backend has no channel for this; lowering must fall back.
#   accepted    — the backend TAKES it without error but does NOT change its output.
#                 Lowered exactly like `unsupported`, and reported, because silently
#                 accepting a control the user believes is working is the worst outcome.
#   honored     — verified to affect the audio.
#
# Every row cites where its claim comes from; see docs/backends/CONTROL_SURVEY.md.

# ------------------------------------------------------------------ Fish

[[backend]]
id = "fish-s1-mini"
krate = "syrinx-fish"
model = "openaudio-s1-mini"
inline = "closed"
granularity = "word"
instruct = "unsupported"
emotion = "honored"
style = "honored"
event = "honored"
prosody = "unsupported"
emphasis = "unsupported"
pause = "unsupported"
speaker_turn = "unsupported"
source = "shipped card ~/models/openaudio-s1-mini/README.md; CONTROL_SURVEY.md §1"
notes = "Closed set of 65 markers (50 emotion + 5 tone + 10 special), spelled `(tag)`. A tag outside the set is not understood, so lowering must map into the set or drop."

