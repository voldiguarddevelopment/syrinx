# Canonical cue vocabulary (C1.1).
#
# Derived from the verified native sets in docs/backends/CONTROL_SURVEY.md (2026-09-03),
# NOT invented: Fish S1's 65 enumerated tags, Fish S2's documented common list,
# CosyVoice's tokenizer `additional_special_tokens`, Step-Audio-EditX's emotion/style
# tables, and Chatterbox Turbo's documented paralinguistics.
#
# Schema (enforced by vocab::tests):
#   [[emotion]] / [[style]] / [[event]]
#     id        canonical snake_case id, unique across ALL kinds
#     arousal   0..1   (calm -> activated)
#     valence   0..1   (negative -> positive)   omitted for `event` and `style`
#     synonyms  author spellings that map here; lowercase; unique across all entries
#     fish_s1   native `(tag)` spelling, or omitted if the closed set has no member
#     fish_s2   native `[tag]` spelling (open vocabulary, so always expressible)
#     cosyvoice native inline token, or omitted (instruct-only)
#     step_audio native `[tag]`, or omitted
#     chatterbox_turbo native `[tag]` INCLUDING the brackets, or omitted
#
# `fish_s2` is always present because S2's vocabulary is open ("15,000+ unique tags");
# absence elsewhere is meaningful and drives Dropped/Hoisted outcomes in the report.
#
# ---------------------------------------------------------------- chatterbox_turbo
#
# Source: the checkpoint's own `added_tokens.json`, enumerated in
# docs/backends/CHATTERBOX_PORT_SCOPE.md (2026-09-12) — nineteen contiguous ids
# 50257-50275, immediately after the 50257-entry GPT-2 base vocabulary, and
# `t3_turbo_v1.yaml`'s `text_tokens_dict_size: 50276` = 50257 + 19 confirms the count.
# The set is CLOSED and complete: CONTROL_SURVEY.md's "and more" is now resolved.
# Spellings are stored WITH their brackets because `[tag]` is literally the native
# surface form (as for `cosyvoice`), and because storing them bracketed makes
# `tests/chatterbox_cue.rs`'s "every spelling is one of the nineteen" check exact.
#
# **Chatterbox Turbo is an UNADOPTED candidate** (CLAUDE.md: Qwen3-TTS is the TTS path).
# No weights are on this box and nothing here has been heard. This column records what
# the token table says, so the question can be asked; it adopts nothing.
#
# Only genuinely unambiguous mappings are recorded. Four are spelling traps, all noted
# in the scope doc and all mapped by MEANING, never by spelling:
#   [whispering] -> our `whisper`      (their spelling is our synonym, not our id)
#   [fear]       -> our `afraid`
#   [gasp]       -> our `quick_breath` (their spelling is our synonym)
#   [narration]  -> our `narrator`
# One more is not in the scope doc's trap list but behaves the same way:
#   [crying]     -> our `sob`          (their spelling is our synonym; upstream files it
#                                       under *emotion* while our taxonomy calls it an
#                                       event. The label reaches the model bracketed and
#                                       inline either way, so the kind disagreement does
#                                       not leak — but it is a real disagreement.)
#
# FIVE of their nineteen have no counterpart here and are deliberately left unmapped:
#   [dramatic]      no canonical style for it (our nearest, `authoritative`, is not it)
#   [advertisement] no canonical style; `broadcast` is news/anchor, not advertising
#   [sniff]         no canonical event
#   [shush]         no canonical event
#   [clear throat]  our vocabulary MERGES throat-clearing into `cough` (it is one of
#                   `cough`'s synonyms, and `fish_s2 = "clearing throat"`), so we cannot
#                   address their two distinct tokens separately. `cough` maps to
#                   `[cough]` on the id match; an author who writes `[clearing throat]`
#                   resolves to `cough` and therefore gets `[cough]`. Splitting `cough`
#                   into two canonical entries would change every other backend column
#                   and belongs in its own task, not in a spelling column.
#
# Notable in the other direction: they have NO `sad` and no `excited`. `sad` is left
# unmapped rather than bent onto `[crying]` — crying is not sadness — and `excited` is
# left unmapped rather than collapsed onto `[happy]`, which would silently discard the
# arousal difference the vocabulary exists to carry. Absence is the honest answer and
# the report will say `Unmapped`.

